[env:esp32dev]
platform = espressif32@^6.12.0
board    = esp32dev
framework = arduino

; === Vitesses de communication ===
monitor_speed = 115200
upload_speed  = 921600

; === Dépendances ===
lib_deps =
  knolleary/PubSubClient@2.8.0
  bblanchon/ArduinoJson@6.21.5

; === Flags de build ===
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D MQTT_KEEPALIVE=60
  -D MQTT_SOCKET_TIMEOUT=10
  
build_unflags =
  -DBOARD_HAS_PSRAM

; === Filtres moniteur série ===
monitor_filters =
  esp32_exception_decoder
  colorize
  time

; === Port (décommenter si besoin) ===
; upload_port = COM3
; monitor_port = COM3
